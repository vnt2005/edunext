<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07151e" />
      <stop offset="100%" stop-color="#0f2738" />
    </linearGradient>
    <linearGradient id="acc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <radialGradient id="nebula" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#07151e" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)" />
  <rect width="800" height="450" fill="url(#nebula)" />
  <rect width="800" height="450" fill="url(#grid)" />

  <!-- Constellation Accent Lines -->
  <g opacity="0.3" stroke="#06b6d4" stroke-width="1" fill="none">
    <circle cx="680" cy="90" r="4" fill="#06b6d4" />
    <circle cx="730" cy="160" r="3" fill="#22d3ee" />
    <circle cx="620" cy="180" r="2" fill="#06b6d4" />
    <circle cx="650" cy="270" r="4" fill="#22d3ee" />
    <circle cx="720" cy="330" r="2" fill="#06b6d4" />
    <line x1="680" y1="90" x2="730" y2="160" />
    <line x1="730" y1="160" x2="620" y2="180" />
    <line x1="620" y1="180" x2="650" y2="270" />
    <line x1="650" y1="270" x2="720" y2="330" />
  </g>

  <!-- Glowing Geometric Aura -->
  <circle cx="680" cy="200" r="140" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.4" />
  <circle cx="680" cy="200" r="90" fill="none" stroke="#22d3ee" stroke-width="1" opacity="0.3" />

  <!-- Left Content Block -->
  <!-- Domain Badge -->
  <rect x="60" y="55" width="145" height="32" rx="16" fill="rgba(255,255,255,0.06)" stroke="#06b6d4" stroke-width="1.2" />
  <circle cx="78" cy="71" r="4" fill="#06b6d4" />
  <text x="92" y="77" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="12" font-weight="700" fill="#06b6d4" letter-spacing="1.5">LĨNH VỰC 46</text>

  <!-- Big Title -->
  <text x="60" y="145" font-family="'Be Vietnam Pro', sans-serif" font-size="34" font-weight="800" fill="#ffffff" width="560">
    Làm đẹp
  </text>

  <!-- Subtitle -->
  <text x="60" y="185" font-family="'Be Vietnam Pro', sans-serif" font-size="16" font-weight="400" fill="rgba(255,255,255,0.7)">
    Thực hành chăm sóc cá nhân và kỹ thuật làm đẹp.
  </text>

  <!-- Topic Pills -->
  <g transform="translate(60, 235)">
    
      <g transform="translate(0, 0)">
        <rect width="120" height="34" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" />
        <text x="60" y="21" font-family="'Be Vietnam Pro', sans-serif" font-size="13" font-weight="500" fill="rgba(255,255,255,0.85)" text-anchor="middle">Chăm sóc da</text>
      </g>
    
      <g transform="translate(130, 0)">
        <rect width="120" height="34" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" />
        <text x="60" y="21" font-family="'Be Vietnam Pro', sans-serif" font-size="13" font-weight="500" fill="rgba(255,255,255,0.85)" text-anchor="middle">trang điểm</text>
      </g>
    
      <g transform="translate(260, 0)">
        <rect width="120" height="34" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" />
        <text x="60" y="21" font-family="'Be Vietnam Pro', sans-serif" font-size="13" font-weight="500" fill="rgba(255,255,255,0.85)" text-anchor="middle">tạo mẫu tóc</text>
      </g>
    
      <g transform="translate(390, 0)">
        <rect width="120" height="34" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" />
        <text x="60" y="21" font-family="'Be Vietnam Pro', sans-serif" font-size="13" font-weight="500" fill="rgba(255,255,255,0.85)" text-anchor="middle">chăm sóc móng</text>
      </g>
    
  </g>

  <!-- Footer Brand -->
  <line x1="60" y1="385" x2="740" y2="385" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
  <text x="60" y="415" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" fill="url(#acc)" letter-spacing="2">EDUNEXT · HỆ SINH THÁI KHÓA HỌC THỰC CHIẾN</text>
  <text x="740" y="415" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="500" fill="rgba(255,255,255,0.4)" text-anchor="end">Chuẩn kỹ năng số 2026</text>
</svg>