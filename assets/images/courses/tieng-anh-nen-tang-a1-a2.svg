<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="c_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#110a1f" />
      <stop offset="100%" stop-color="#20113c" />
    </linearGradient>
    <linearGradient id="c_acc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="c_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <radialGradient id="c_orb" cx="85%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#c084fc" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#110a1f" stop-opacity="0" />
    </radialGradient>
    <pattern id="c_grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1280" height="720" fill="url(#c_bg)" />
  <rect width="1280" height="720" fill="url(#c_orb)" />
  <rect width="1280" height="720" fill="url(#c_grid)" />

  <!-- Outer Neon Border Frame -->
  <rect x="24" y="24" width="1232" height="672" rx="28" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />
  <rect x="24" y="24" width="1232" height="672" rx="28" fill="none" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="16 12" opacity="0.3" />

  <!-- Thematic Right-Hand Diagram (Cyber Tech Isometric Schematics) -->
  <g transform="translate(860, 240)">
    <!-- Central Hexagonal Energy Core -->
    <polygon points="120,40 220,100 220,210 120,270 20,210 20,100" fill="rgba(255,255,255,0.02)" stroke="#8b5cf6" stroke-width="2.5" opacity="0.8" />
    <polygon points="120,65 195,110 195,195 120,245 45,195 45,110" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6" />
    <circle cx="120" cy="155" r="36" fill="#8b5cf6" opacity="0.15" />
    <circle cx="120" cy="155" r="16" fill="url(#c_acc)" />

    <!-- Circuit traces connecting nodes -->
    <path d="M 220 100 L 320 60 L 360 60" stroke="#8b5cf6" stroke-width="2" fill="none" opacity="0.7" />
    <circle cx="360" cy="60" r="6" fill="#8b5cf6" />

    <path d="M 220 210 L 300 260 L 340 260" stroke="#c084fc" stroke-width="2" fill="none" opacity="0.7" />
    <circle cx="340" cy="260" r="5" fill="#c084fc" />

    <path d="M 20 100 L -60 70 L -100 70" stroke="#8b5cf6" stroke-width="2" fill="none" opacity="0.6" />
    <circle cx="-100" cy="70" r="5" fill="#8b5cf6" />

    <path d="M 120 270 L 120 340 L 160 380" stroke="#c084fc" stroke-width="2" fill="none" opacity="0.5" />
    <circle cx="160" cy="380" r="4" fill="#c084fc" />

    <!-- Floating HUD card -->
    <rect x="220" y="110" width="130" height="65" rx="10" fill="rgba(10,15,30,0.85)" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
    <text x="235" y="135" font-family="'Space Grotesk', monospace" font-size="11" font-weight="700" fill="#8b5cf6">STATUS: VERIFIED</text>
    <text x="235" y="155" font-family="'Space Grotesk', monospace" font-size="13" font-weight="600" fill="#ffffff">8/8 MODULES</text>
  </g>

  <!-- Left Main Content -->
  <!-- Eyebrow Pill -->
  <g transform="translate(80, 110)">
    <rect width="260" height="38" rx="19" fill="rgba(255,255,255,0.06)" stroke="#8b5cf6" stroke-width="1.4" />
    <circle cx="20" cy="19" r="5" fill="#8b5cf6" />
    <text x="36" y="24" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" fill="#8b5cf6" letter-spacing="1.5">MÃ 31.1 · TIẾNG ANH</text>
  </g>

  <!-- Course Title (Multline support) -->
  <g transform="translate(80, 210)">
    <text font-family="'Be Vietnam Pro', sans-serif" font-size="44" font-weight="800" fill="#ffffff" line-height="1.2">
      
        <tspan x="0" y="0">Tiếng Anh nền tảng A1–A2</tspan>
      
    </text>
  </g>

  <!-- Meta Badges (Lessons, Level, Lifetime) -->
  <g transform="translate(80, 440)">
    <!-- Badge 1: Lessons -->
    <g transform="translate(0, 0)">
      <rect width="170" height="46" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.14)" />
      <text x="20" y="28" font-family="'Be Vietnam Pro', sans-serif" font-size="14" font-weight="600" fill="#ffffff">📚 8 bài giảng HD</text>
    </g>

    <!-- Badge 2: Level -->
    <g transform="translate(186, 0)">
      <rect width="150" height="46" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.14)" />
      <text x="20" y="28" font-family="'Be Vietnam Pro', sans-serif" font-size="14" font-weight="600" fill="#ffffff">⚡ Chưa xác định</text>
    </g>

    <!-- Badge 3: Duration -->
    <g transform="translate(352, 0)">
      <rect width="160" height="46" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.14)" />
      <text x="20" y="28" font-family="'Be Vietnam Pro', sans-serif" font-size="14" font-weight="600" fill="#ffffff">⏱ 8 bài giảng</text>
    </g>
  </g>

  <!-- Bottom Brand Footnote -->
  <line x1="80" y1="620" x2="1200" y2="620" stroke="rgba(255,255,255,0.08)" stroke-width="1.2" />
  <g transform="translate(80, 655)">
    <text font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="800" fill="url(#c_acc)" letter-spacing="2.5">EDUNEXT MASTERCLASS</text>
    <text x="1120" y="0" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="500" fill="rgba(255,255,255,0.4)" text-anchor="end">Kiến trúc giáo dục trực tuyến chuẩn quốc tế</text>
  </g>
</svg>